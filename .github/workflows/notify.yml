name: YouTube to Discord

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 몇 분 지연될 수 있음)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write             # seen.json 커밋용

concurrency:
  group: yt-notify
  cancel-in-progress: false   # 동시 실행 방지 (중복 전송 예방)

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check channels and send to Discord
        run: python yt_to_discord.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if ! git diff --cached --quiet; then
            git commit -m "update seen.json"
            git push
          fi
