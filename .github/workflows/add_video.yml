name: Add video manually

on:
  workflow_dispatch:
    inputs:
      url:
        description: "유튜브 영상 URL (여러 개면 공백이나 줄바꿈으로 구분)"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create candidate issue from URL
        run: python add_video.py
        env:
          VIDEO_URL: ${{ inputs.url }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_REVIEW_WEBHOOK_URL: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save candidates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "update candidates.json"
            git pull --rebase
            git push
          fi
