name: Search YouTube candidates

on:
  schedule:
    - cron: "7 * * * *"      # 매시 7분 (검색 API 할당량 때문에 1시간 간격)
  workflow_dispatch:

permissions:
  contents: write            # candidates.json 커밋
  issues: write              # 후보 이슈 생성

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search keywords and create candidate issues
        run: python search_candidates.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_REVIEW_WEBHOOK_URL: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save candidates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "update candidates.json"
            git pull --rebase
            git push
          fi
